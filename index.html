<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Mods de GD</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>MIS MODS</h1>
    <p>Colección de mods y herramientas para Geometry Dash / Geode</p>
    <input type="text" id="buscador" placeholder="Buscar mod por nombre o tag...">
  </header>

  <main id="grid-mods"></main>

  <footer>
    <a href="https://github.com/tu-usuario" target="_blank">GitHub</a>
  </footer>

  <script>
    const grid = document.getElementById('grid-mods');
    const buscador = document.getElementById('buscador');
    let todosLosMods = [];

    fetch('mods.json')
      .then(res => res.json())
      .then(data => {
        todosLosMods = data;
        renderMods(todosLosMods);
      });

    function renderMods(lista) {
      grid.innerHTML = lista.map(mod => `
        <article class="card">
          <div class="card-header">
            <h2>${mod.nombre}</h2>
            <span class="badge">${mod.version}</span>
          </div>
          <p class="desc">${mod.descripcion}</p>
          <div class="tags">
            ${mod.tags.map(t => `<span class="tag">${t}</span>`).join('')}
          </div>
          <div class="actions">
            <a href="${mod.descarga}" class="btn primary" target="_blank">Descargar</a>
            <a href="${mod.github}" class="btn" target="_blank">Código</a>
          </div>
        </article>
      `).join('');
    }

    buscador.addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      const filtrados = todosLosMods.filter(m => 
        m.nombre.toLowerCase().includes(q) || 
        m.descripcion.toLowerCase().includes(q) ||
        m.tags.some(t => t.toLowerCase().includes(q))
      );
      renderMods(filtrados);
    });
  </script>
</body>
</html>
